# =============================================================================
# Luna Emotion Companion — nginx staging reverse proxy
# =============================================================================
#
# PURPOSE
# -------
# Terminates TLS, redirects HTTP → HTTPS, forwards requests to the FastAPI
# application container, and sets security headers that the app cannot set
# at the TLS layer (HSTS, CSP).
#
# PREREQUISITES
# -------------
# 1. Replace every occurrence of staging.REPLACE_WITH_YOUR_DOMAIN.com with
#    the actual staging hostname before deploying.
# 2. Place the TLS certificate files in nginx/certs/:
#      fullchain.pem  — certificate + intermediate chain (PEM)
#      privkey.pem    — private key (PEM, permissions: 600, owned by root)
#    Recommended: obtain a free certificate via Let's Encrypt / Certbot.
# 3. The upstream "app" resolves via Docker Compose's internal DNS because
#    nginx runs in the same Compose network (luna_staging_net).
#
# CERTIFICATE RENEWAL
# --------------------
# When using Certbot with Docker:
#   certbot certonly --webroot -w /var/www/certbot -d staging.example.com
# Point the webroot to /var/www/certbot and add a Compose volume for it.
# After renewal, reload nginx: docker compose exec nginx nginx -s reload
#
# =============================================================================

# ── Upstream ──────────────────────────────────────────────────────────────────
upstream luna_app {
    # "app" resolves to the FastAPI container via Compose internal DNS.
    # keepalive maintains persistent connections to the backend.
    server app:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name staging.REPLACE_WITH_YOUR_DOMAIN.com;

    # Allow Let's Encrypt ACME challenge through before redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS permanently.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.REPLACE_WITH_YOUR_DOMAIN.com;

    # ── TLS certificate ───────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────────
    # Require TLS 1.2 minimum; disable SSLv3, TLS 1.0, TLS 1.1.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong cipher suite — forward secrecy + AEAD preferred.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # DH param for DHE cipher suites (if used):
    # Generate with: openssl dhparam -out /etc/nginx/certs/dhparam.pem 2048
    # Then uncomment:
    # ssl_dhparam /etc/nginx/certs/dhparam.pem;

    # Session cache — improves TLS resumption performance.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — reduces client TLS handshake latency.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Security headers ──────────────────────────────────────────────────────
    # HSTS: tell browsers to only connect over HTTPS for 1 year.
    # Remove includeSubDomains if staging is on a shared subdomain.
    # Do NOT add preload until you are ready to submit to the HSTS preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The FastAPI application also sets X-Content-Type-Options, X-Frame-Options,
    # Referrer-Policy, and Permissions-Policy via SecurityHeadersMiddleware.
    # nginx does not override those — they are set at the application layer.

    # Content-Security-Policy — adjust to match your frontend's actual requirements.
    # This is a strict default for an API-only backend (no HTML served).
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # ── Request size limits ───────────────────────────────────────────────────
    # 10 MB covers the largest expected request (conversation messages + history).
    client_max_body_size 10m;

    # ── Timeouts ─────────────────────────────────────────────────────────────
    # AI provider calls can take up to AI_TIMEOUT seconds (default 30).
    # proxy_read_timeout must be larger to avoid nginx cutting the connection first.
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    # ── Forwarded headers ─────────────────────────────────────────────────────
    # These headers tell the FastAPI application the real client IP and the
    # original protocol. The application must trust these headers only from
    # the nginx proxy — not from arbitrary clients.
    #
    # NOTE: The current FastAPI application does not call
    # app.add_middleware(TrustedHostMiddleware) or configure uvicorn's
    # --forwarded-allow-ips. Before enabling X-Forwarded-For in production,
    # verify that the application correctly reads the forwarded client IP
    # (request.client.host) only when the request arrives from a trusted proxy.
    # For staging, setting these headers is sufficient — review before production.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Preserve the upstream connection for keepalive.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── API proxy ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://luna_app;
    }

    # ── Health / readiness — accessible without auth ──────────────────────────
    location /health {
        proxy_pass http://luna_app;
        # No access log for health checks — avoids noise in logs.
        access_log off;
    }

    location /ready {
        proxy_pass http://luna_app;
        access_log off;
    }

    # ── Metrics — restrict to internal network only ───────────────────────────
    # /metrics exposes Prometheus counters. Do not expose this publicly.
    # Allow only from the Docker internal network (adjust CIDR as needed).
    location /metrics {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://luna_app;
        access_log off;
    }

    # ── Block common exploit paths ────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
