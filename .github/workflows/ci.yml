name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff==0.16.3 mypy==2.3.1

      - name: Run Ruff lint check
        working-directory: backend
        run: ruff check .

      - name: Run Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Run mypy static type analysis
        working-directory: backend
        run: mypy app

  test-and-migration:
    name: PostgreSQL, Alembic & Automated Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: luna_test_user
          POSTGRES_PASSWORD: luna_test_password
          POSTGRES_DB: luna_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify PostgreSQL connectivity and health
        run: |
          python - <<'EOF'
          import os, psycopg2
          url = os.environ["DATABASE_URL"]
          conn = psycopg2.connect(url)
          conn.close()
          print("PostgreSQL CI connection verified successfully")
          EOF
        env:
          DATABASE_URL: postgresql://luna_test_user:luna_test_password@localhost:5432/luna_test_db

      - name: Run Alembic migrations and verify head
        working-directory: backend
        env:
          DATABASE_URL: postgresql://luna_test_user:luna_test_password@localhost:5432/luna_test_db
        run: |
          alembic upgrade head
          alembic current

      - name: Run automated test suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://luna_test_user:luna_test_password@localhost:5432/luna_test_db
          SECRET_KEY: ci-environment-test-secret-key-32-chars-long
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
          AI_PROVIDER: mock
          TESTING: "true"
          ENVIRONMENT: development
          DEBUG: "false"
          CORS_ORIGINS: http://localhost:3000
        run: |
          pytest -v

  security-scan:
    name: Security & Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1

      - name: Run dependency vulnerability audit
        working-directory: backend
        run: |
          pip-audit --progress-spinner off -r requirements.txt \
            --ignore-vuln PYSEC-2026-1325
        # PYSEC-2026-1325 (CVE-2026-33936): ecdsa DoS via DER length validation.
        # ecdsa 0.19.2 is the patched version — pip-audit database lags behind.
        # Transitive dependency of python-jose; no direct use of DER key parsing.

      - name: Scan repository for accidentally committed secrets
        run: |
          python - <<'EOF'
          import os, re, sys

          # Patterns for real credentials — does NOT flag CI-only test credentials
          # in workflow files or placeholder values in .env.example
          patterns = [
              ("openai_key",   re.compile(r"sk-[a-zA-Z0-9]{20,}")),
              ("github_token", re.compile(r"ghp_[a-zA-Z0-9]{20,}")),
              ("private_key",  re.compile(r"BEGIN (RSA|OPENSSH|EC|DSA)? ?PRIVATE KEY")),
          ]
          skip_dirs  = {".git", "venv", ".venv", "__pycache__",
                        ".pytest_cache", ".mypy_cache", ".ruff_cache"}
          skip_files = {".env", ".env.local", ".env.production", "test_luna.db"}
          skip_exts  = {".db", ".pyc", ".pyo", ".whl", ".zip", ".tar", ".gz"}

          leaks = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in skip_dirs]
              for fname in files:
                  if fname in skip_files:
                      continue
                  _, ext = os.path.splitext(fname)
                  if ext in skip_exts:
                      continue
                  path = os.path.join(root, fname)
                  try:
                      content = open(path, encoding="utf-8", errors="ignore").read()
                      for label, pat in patterns:
                          if pat.search(content):
                              leaks.append((label, path))
                  except Exception:
                      pass

          if leaks:
              for label, path in leaks:
                  print(f"LEAK [{label}]: {path}", file=sys.stderr)
              sys.exit(1)

          print("Secret scan clean: no credentials found in tracked files.")
          EOF

  docker-build:
    name: Docker Build & Container Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        run: |
          docker build -t luna-emotion-companion-backend:ci -f backend/Dockerfile backend

      - name: Verify .env exclusion from image
        run: |
          if docker run --rm luna-emotion-companion-backend:ci test -f /app/.env; then
            echo "ERROR: .env file found inside Docker image!"
            exit 1
          fi
          echo ".env correctly excluded from image."

      - name: Verify non-root runtime user
        run: |
          USER_ID=$(docker run --rm luna-emotion-companion-backend:ci id -u)
          if [ "$USER_ID" = "0" ]; then
            echo "ERROR: Container is running as root!"
            exit 1
          fi
          echo "Non-root user confirmed (uid=$USER_ID)."

      - name: Verify application modules load inside container
        run: |
          # DATABASE_URL and SECRET_KEY are required at import time:
          #   app/db/database.py raises RuntimeError if DATABASE_URL is unset
          #   app/main.py calls validate_security_config() which reads SECRET_KEY
          # ENVIRONMENT=development bypasses the production hardening checks.
          docker run --rm \
            -e DATABASE_URL=postgresql://placeholder:placeholder@localhost/placeholder \
            -e SECRET_KEY=ci-module-load-check-placeholder-key \
            -e ENVIRONMENT=development \
            luna-emotion-companion-backend:ci \
            python -c "import app.main; print('Container application modules load cleanly')"
