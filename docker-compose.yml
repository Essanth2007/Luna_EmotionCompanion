# Luna Emotion Companion — local / deployment composition.
# Build contexts point at the service directories inside the monorepo.
# Secrets (SECRET_KEY, database passwords, JWT) must be supplied via environment
# or a local .env file — never committed to the repository.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luna}
      POSTGRES_USER: ${POSTGRES_USER:-luna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luna}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luna}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ./services/ai/emotion-ai-service
      dockerfile: ../../docker/ai/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
    ports:
      - "8001:8001"
    depends_on:
      - postgres

  backend:
    build:
      context: ./services/backend/backend
      dockerfile: ../../docker/backend/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      DATABASE_URL: ${DATABASE_URL:-postgresql://luna:luna@postgres:5432/luna}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8001}
      COMMUNICATION_SERVICE_URL: ${COMMUNICATION_SERVICE_URL:-http://communication:8002}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started

  communication:
    build:
      context: ./services/communication
      dockerfile: ../../docker/communication/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      BACKEND_INTERNAL_TOKEN: ${SECRET_KEY}
    ports:
      - "8002:8002"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8002}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - communication

volumes:
  pgdata:
