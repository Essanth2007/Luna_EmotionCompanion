# =============================================================================
# Luna Emotion Companion — STAGING Docker Compose
# =============================================================================
#
# USAGE
# -----
#   # From the backend/ directory:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up --build -d
#   docker compose -f docker-compose.staging.yml --env-file .env.staging logs -f
#   docker compose -f docker-compose.staging.yml --env-file .env.staging down
#
# PREREQUISITES
# -------------
# * .env.staging must be populated with real values (never committed to Git).
# * An nginx reverse proxy must terminate TLS in front of this stack.
#   See nginx/staging.conf for the recommended configuration.
# * Ports: only port 8000 is exposed (to the nginx container network).
#   PostgreSQL port 5432 is NOT exposed to the host or internet.
#
# DIFFERENCES FROM development docker-compose.yml
# -----------------------------------------------
# * ENVIRONMENT=production — enables all hardening checks at startup.
# * No port mapping for db — PostgreSQL is only reachable within luna_staging_net.
# * Named volume uses a staging-specific name to avoid collisions with dev data.
# * Restart policy: always (production-like).
# * Resource limits set to reasonable staging values.
# * Healthcheck on app service uses /ready (checks DB) not just /health.
#
# =============================================================================

services:

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env.staging}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - luna_staging_net
    # PostgreSQL is intentionally not mapped to a host port.
    # It is only reachable from the app container within luna_staging_net.
    deploy:
      resources:
        limits:
          memory: 512m

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env.staging}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env.staging}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT: ${AI_TIMEOUT:-30}
      # ENVIRONMENT=production activates validate_security_config():
      #   - SECRET_KEY must be ≥ 32 chars and not a known weak value
      #   - DEBUG must be false
      #   - CORS_ORIGINS must be non-empty
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set in .env.staging}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TESTING: "false"
    depends_on:
      db:
        condition: service_healthy
    # Port 8000 is exposed only within luna_staging_net.
    # The nginx reverse proxy connects to this port — it is not mapped to the host.
    expose:
      - "8000"
    networks:
      - luna_staging_net
    healthcheck:
      # /ready checks PostgreSQL connectivity — more useful than /health for staging
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Operator must supply:
      #   ../nginx/staging.conf  — nginx configuration (see nginx/staging.conf)
      #   ../nginx/certs/        — TLS certificate and private key
      #     fullchain.pem        — certificate + intermediate chain
      #     privkey.pem          — private key (permissions: 600, owned by root)
      - ../nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - luna_staging_net
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  # Staging volume is named distinctly to avoid collisions with development data.
  postgres_staging_data:

networks:
  luna_staging_net:
    driver: bridge
